<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examples &mdash; dash-seqviz</title>
    <meta name="description" content="Curated examples of dash-seqviz in academic and industrial contexts. Classroom demos, biofoundry cassettes, natural-product clusters, binary vectors — 10 ready-to-paste patterns.">

    <link rel="stylesheet" href="./assets/site.css?v=17">
</head>
<body data-page="examples">

<div id="site-nav-mount"></div>

<header class="hero">
    <h1>Examples</h1>
    <p>Ten curated patterns &mdash; five for classrooms, five for industrial teams. Each ships with a Python <code>dash-seqviz</code> snippet you can paste into a new app.</p>
</header>

<section>
    <div class="container">
        <div class="gallery-filter" role="toolbar" aria-label="Filter examples">
            <div class="filter-group" id="filter-category" role="radiogroup" aria-label="Category">
                <button type="button" data-cat="all" class="active">All</button>
                <button type="button" data-cat="academic">Academia</button>
                <button type="button" data-cat="industrial">Industry</button>
            </div>
            <div class="filter-group" id="filter-sort" role="radiogroup" aria-label="Sort">
                <button type="button" data-sort="featured" class="active">Featured</button>
                <button type="button" data-sort="complexity-asc">Simplest first</button>
                <button type="button" data-sort="complexity-desc">Most complex</button>
            </div>
            <input id="filter-search" class="filter-search" type="text" placeholder="Search examples..." aria-label="Search examples">
        </div>

        <div id="gallery-grid" class="gallery-grid"></div>
        <div id="gallery-empty" class="gallery-empty" style="display: none;">
            No examples match the current filters.
        </div>
    </div>
</section>

<footer>
    <p>
        Built by <a href="https://github.com/Full-Spectrum-Analytics" target="_blank" rel="noopener">Full Spectrum Analytics</a>
        &middot; Powered by <a href="https://github.com/Lattice-Automation/seqviz" target="_blank" rel="noopener">seqviz</a>
        &middot; <a href="https://github.com/Full-Spectrum-Analytics/dash-seqviz" target="_blank" rel="noopener">Source on GitHub</a>
    </p>
</footer>

<script src="./assets/nav.js"></script>
<script src="./data/examples.js?v=29"></script>

<script>
    (function () {
        var state = {
            category: "all",
            sort: "featured",
            search: ""
        };

        // Allow deep-linking: /examples.html?category=industrial&tag=CRISPR
        var params = new URLSearchParams(window.location.search);
        if (params.get("category")) state.category = params.get("category");
        if (params.get("search"))   state.search   = params.get("search");

        var grid = document.getElementById("gallery-grid");
        var empty = document.getElementById("gallery-empty");
        var searchInput = document.getElementById("filter-search");
        searchInput.value = state.search;

        function syncActive() {
            document.querySelectorAll("#filter-category button").forEach(function (b) {
                b.classList.toggle("active", b.dataset.cat === state.category);
            });
            document.querySelectorAll("#filter-sort button").forEach(function (b) {
                b.classList.toggle("active", b.dataset.sort === state.sort);
            });
        }

        function matches(ex) {
            if (state.category !== "all" && ex.category !== state.category) return false;
            if (state.search) {
                var q = state.search.trim().toLowerCase();
                var hay = [ex.title, ex.summary, ex.accession, (ex.tags || []).join(" ")]
                    .join(" ").toLowerCase();
                if (hay.indexOf(q) === -1) return false;
            }
            return true;
        }

        function sortList(list) {
            var copy = list.slice();
            if (state.sort === "complexity-asc") {
                copy.sort(function (a, b) { return (a.complexity || 0) - (b.complexity || 0); });
            } else if (state.sort === "complexity-desc") {
                copy.sort(function (a, b) { return (b.complexity || 0) - (a.complexity || 0); });
            } else {
                // featured first, then by complexity asc
                copy.sort(function (a, b) {
                    var af = a.featured ? 0 : 1;
                    var bf = b.featured ? 0 : 1;
                    if (af !== bf) return af - bf;
                    return (a.complexity || 0) - (b.complexity || 0);
                });
            }
            return copy;
        }

        function slugify(s) {
            return s.toLowerCase()
                .replace(/\u03b2/g, "beta").replace(/\u03b1/g, "alpha")
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-+|-+$/g, "");
        }

        function thumbSlugFor(ex) {
            if (ex.pathway && Array.isArray(ex.pathway.nodes) && ex.pathway.nodes.length) {
                var last = ex.pathway.nodes[ex.pathway.nodes.length - 1];
                if (last && last.name) return { slug: slugify(last.name), name: last.name };
            }
            if (ex.compound && ex.compound.name) {
                return { slug: slugify(ex.compound.name), name: ex.compound.name };
            }
            return null;
        }

        function render() {
            var all = window.DASH_SEQVIZ_EXAMPLES || [];
            var filtered = sortList(all.filter(matches));
            grid.innerHTML = "";
            empty.style.display = filtered.length === 0 ? "block" : "none";

            filtered.forEach(function (ex) {
                var a = document.createElement("a");
                a.className = "gallery-card";
                a.href = "./example.html?id=" + encodeURIComponent(ex.id);

                // Build the text stack first so badges/title/summary
                // can wrap using the FULL card width (no thumbnail
                // competing for horizontal space anymore).
                var badges = document.createElement("div");
                badges.className = "card-badges";

                var catBadge = document.createElement("span");
                catBadge.className = "badge " + (ex.category === "academic" ? "badge-academic" : "badge-industrial");
                catBadge.textContent = ex.category === "academic" ? "academia" : "industry";
                badges.appendChild(catBadge);

                var cxBadge = document.createElement("span");
                cxBadge.className = "badge badge-complexity";
                cxBadge.textContent = "complexity " + (ex.complexity || "?");
                badges.appendChild(cxBadge);

                if (ex.compound) {
                    var molBadge = document.createElement("span");
                    molBadge.className = "badge badge-tag";
                    molBadge.textContent = "\u2697\uFE0F " + ex.compound.name;
                    badges.appendChild(molBadge);
                }

                (ex.tags || []).slice(0, 2).forEach(function (t) {
                    var b = document.createElement("span");
                    b.className = "badge badge-tag";
                    b.textContent = t;
                    badges.appendChild(b);
                });
                a.appendChild(badges);

                var h = document.createElement("h3");
                h.textContent = ex.title;
                a.appendChild(h);

                var p = document.createElement("p");
                p.textContent = ex.summary;
                a.appendChild(p);

                // Thumbnail sits in normal flow between summary and
                // the accession — centered horizontally via CSS.
                // onerror falls back to a text-only layout by
                // stripping the .has-thumb class.
                var thumbInfo = thumbSlugFor(ex);
                if (thumbInfo) {
                    var thumb = document.createElement("img");
                    thumb.className = "card-thumb";
                    thumb.alt = thumbInfo.name + " structure";
                    thumb.loading = "lazy";
                    thumb.src = "./assets/molecules/" + thumbInfo.slug + ".svg";
                    thumb.onerror = function () {
                        thumb.remove();
                        a.classList.remove("has-thumb");
                    };
                    a.classList.add("has-thumb");
                    a.appendChild(thumb);
                }

                // Accession stays as the last child so it anchors
                // the bottom of the card regardless of thumbnail.
                var meta = document.createElement("div");
                meta.className = "card-meta";
                meta.textContent = ex.accession;
                a.appendChild(meta);

                grid.appendChild(a);
            });
            syncActive();
        }

        document.querySelectorAll("#filter-category button").forEach(function (b) {
            b.addEventListener("click", function () {
                state.category = b.dataset.cat;
                render();
            });
        });
        document.querySelectorAll("#filter-sort button").forEach(function (b) {
            b.addEventListener("click", function () {
                state.sort = b.dataset.sort;
                render();
            });
        });
        searchInput.addEventListener("input", function (e) {
            state.search = e.target.value || "";
            render();
        });

        render();
    })();
</script>

</body>
</html>
