<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="dash-seqviz">
  <!-- Plasmid scaffold ring -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#1e293b" stroke-width="3"/>
  <!-- Annotation arc: forward (FSA cyan) -->
  <path d="M 32 6 A 26 26 0 0 1 58 32" fill="none" stroke="#00B1CD" stroke-width="8" stroke-linecap="round"/>
  <!-- Annotation arc: reverse (FSA lime) -->
  <path d="M 6 32 A 26 26 0 0 1 32 6" fill="none" stroke="#91d16e" stroke-width="8" stroke-linecap="round"/>
  <!-- Cut-site tick (FSA coral) -->
  <line x1="32" y1="50" x2="32" y2="58" stroke="#fe6f52" stroke-width="4" stroke-linecap="round"/>
</svg>
