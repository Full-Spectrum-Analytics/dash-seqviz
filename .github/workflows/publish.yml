name: Publish to PyPI & npm

on:
  release:
    types: [published]
  workflow_call:

permissions:
  contents: read
  id-token: write  # required for PyPI and npm trusted publishing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install npm dependencies
        run: npm ci

      - name: Build JS bundle
        run: npm run build:js

      - name: Install Python build tools
        run: pip install --upgrade pip build

      - name: Install dash for component generation
        run: pip install -r requirements.txt

      - name: Generate Dash component
        run: npm run build:backends

      - name: Validate package
        run: npm run validate-init

      - name: Build Python sdist and wheel
        run: python -m build

      - name: Upload Python artifacts
        uses: actions/upload-artifact@v5
        with:
          name: python-dist
          path: dist/

      - name: Upload npm artifacts
        uses: actions/upload-artifact@v5
        with:
          name: npm-package
          path: "*.tgz"

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # trusted publishing (no token needed)
    steps:
      - name: Download Python artifacts
        uses: actions/download-artifact@v5
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses trusted publishing - configure at pypi.org/manage/project/dash-seqviz/settings/publishing/

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # trusted publishing (no token needed)
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"  # ships with npm 11.x for trusted publishing
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install npm dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build JS bundle
        run: npm run build:js

      - name: Generate Dash component
        run: npm run build:backends

      - name: Publish to npm
        run: npm publish --access public --provenance
        # Uses trusted publishing - configure at npmjs.com/package/dash_seqviz/access
        # Python + dash are required because npm publish runs the prepublishOnly
        # hook -> validate-init -> python _validate_init.py, which imports
        # dash_seqviz (which in turn imports dash).
