name: Release

# Runs on every push to main. release-please opens or updates a release PR
# from conventional-commit messages. When that PR is merged, release-please
# tags + creates a GitHub release on the same workflow run, then we dispatch
# publish.yml against the new tag.
#
# Why dispatch instead of `uses: ./.github/workflows/publish.yml` (reusable
# workflow) or inlining the jobs:
#   - PyPI's Trusted Publishing rejects OIDC tokens from reusable workflows.
#   - npm's Trusted Publisher allows only one configuration per package, so
#     inlining publish jobs in two different workflow files won't work.
# Dispatching publish.yml runs it as a top-level workflow, so its OIDC
# token reports `publish.yml` as the workflow ref — the same as a manual
# `release: published` event — and a single Trusted Publisher entry on
# each registry covers both paths.
#
# GITHUB_TOKEN can trigger workflow_dispatch events (unlike release/push
# events, which are suppressed to prevent recursion), so no PAT is needed.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  dispatch-publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write  # required to dispatch publish.yml
    steps:
      - name: Dispatch publish.yml for the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh workflow run publish.yml --repo ${{ github.repository }} --ref main -f ref="$TAG"
