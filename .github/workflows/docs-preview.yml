name: Docs preview

# Deploys a live preview of the static docs site (docs/) to Cloudflare Pages
# for each pull request, and comments the preview URL on the PR.
#
# Activates only once the Cloudflare secrets are configured; until then every
# step is skipped, so it never adds a failing check. Setup steps are in
# CONTRIBUTING.md ("PR preview deployments").

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs-preview.yml"

permissions:
  contents: read
  pull-requests: write

# One in-flight preview per PR; newer pushes cancel older deploys.
concurrency:
  group: docs-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    # Secrets can't be read in `if:` directly, so surface presence via env.
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Note when unconfigured
        if: env.HAS_CF != 'true'
        run: echo "Cloudflare secrets not set - skipping docs preview. See CONTRIBUTING.md."

      - uses: actions/checkout@v5
        if: env.HAS_CF == 'true'

      - name: Deploy docs/ to Cloudflare Pages (preview)
        id: deploy
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy docs
            --project-name=dash-seqviz
            --branch=${{ github.head_ref }}

      - name: Comment preview URL on the PR
        if: env.HAS_CF == 'true' && steps.deploy.outputs.deployment-url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = ${{ toJSON(steps.deploy.outputs.deployment-url) }};
            const marker = '<!-- docs-preview -->';
            const body = `${marker}\n📖 **Docs preview** for this PR: ${url}\n\n_Updates on every push to \`docs/\`._`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
